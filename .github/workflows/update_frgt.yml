name: Update frgt.txt

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: update-frgt
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore subscription cache
        uses: actions/cache@v4
        with:
          path: |
            frgt.txt
            .cache/frgt.txt
          key: frgt-subscription-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            frgt-subscription-${{ github.ref_name }}-

      - name: Generate frgt.txt
        run: python proxy_parser.py

      - name: Commit frgt.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frgt.txt
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update frgt.txt"
          git push
