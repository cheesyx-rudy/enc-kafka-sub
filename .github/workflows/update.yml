name: Check and update proxy URLs

on:
  workflow_dispatch:
  schedule:
    - cron: "30 * * * *"

permissions:
  contents: write

concurrency:
  group: kafka-health-test
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download latest Mihomo
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request
          data=json.load(urllib.request.urlopen('https://api.github.com/repos/MetaCubeX/mihomo/releases/latest'))
          assets=data['assets']
          asset=next(a for a in assets if a['name'].startswith('mihomo-linux-amd64-v3-') and a['name'].endswith('.gz'))
          print(asset['browser_download_url'])
          open('/tmp/mihomo_url','w').write(asset['browser_download_url'])
          PY
          curl -L "$(cat /tmp/mihomo_url)" -o /tmp/mihomo.gz
          gunzip /tmp/mihomo.gz
          chmod +x /tmp/mihomo

      - name: Check proxies
        env:
          MIHOMO_BIN: /tmp/mihomo
          TEST_URL: http://www.gstatic.com/generate_204
          TEST_TIMEOUT_MS: "5000"
        run: python proxy_parser.py

      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add proxies.txt
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update working proxy URLs"
          git pull --rebase origin main
          git push origin HEAD:main
